name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          extensions: libxml, simplexml

      - uses: ramsey/composer-install@v3

      - uses: taiki-e/install-action@just

      # rumdl v0.2.55 (install-only; lint runs inside `just ci`)
      - uses: rvben/rumdl@4997ff07b63c7a54d6a495ebcd3ce7f23ee1173f
        with:
          install-only: true

      - run: just ci
